name: Pubblica Calendario Turni
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica versione esistente del calendario
        run: |
          mkdir -p public
          curl --fail --location --retry 3 "https://keen-gecko-48b725.netlify.app/" -o public/index.html
          test -s public/index.html
          grep -qi '<html' public/index.html
          for file in icon-192.png icon-512.png manifest.webmanifest; do
            curl --fail --location "https://keen-gecko-48b725.netlify.app/$file" -o "public/$file" || true
          done
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
